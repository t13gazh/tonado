name: Build Pi Image

# Builds a flashable Tonado image with pi-gen, signs it, and attaches it to
# the GitHub release for the triggering tag. Mechanics match the REAL stage in
# scripts/pi-gen-stage/stage-tonado/: the Tonado code enters the image via
# `git clone --branch <tag>` inside the chroot (02-tonado-code), driven by the
# TONADO_VERSION / TONADO_EXPECTED_SHA pi-gen config vars. No tarball, no npm
# here — web/build/ is committed in the repo and the stage installs `.[pi]`.
#
# Reference: docs/fuer-entwickler/pi-image-ci.md, pi-image-architecture.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v0.4.0-beta). Must already exist on the remote — the stage clones it.'
        type: string
        required: true
      upload:
        description: 'Upload the built images to that tag''s release?'
        type: boolean
        default: false
  pull_request:
    paths:
      - 'scripts/pi-gen-stage/**'
      - 'system/**'
      - '.github/workflows/pi-image.yml'
      - 'scripts/ci/qemu-smoke.sh'
      - 'scripts/ci/release-notes.sh'
      - 'scripts/ci/assert-no-baked-db.sh'

permissions:
  contents: write      # gh release upload / edit
  id-token: write      # cosign keyless + attest-build-provenance
  attestations: write  # attest-build-provenance

# pi-gen upstream is pinned to a commit, NOT a branch head, for reproducible
# images (supply-chain F7). pi-gen has per-release branches:
#   master           → trixie (Debian 13, current testing)
#   bookworm         → armhf  for Debian 12 / Pi OS 12 stable
#   bookworm-arm64   → arm64  for Debian 12 / Pi OS 12 stable
# Tonado targets Pi OS Bookworm (matches Pi 3B+ live test, HifiBerry,
# MFRC522 fix). Refresh before a release and update here:
#   git ls-remote --heads https://github.com/RPi-Distro/pi-gen
# Refreshed 2026-06-02 → bookworm branch HEADs:
env:
  PI_GEN_REF_ARM64: '67262a4ad0959aab2a9d84a6392b1967999e8f50'
  PI_GEN_REF_ARMHF: 'de9df5623109331cebf990578f342583d9138376'

jobs:
  build:
    strategy:
      fail-fast: false   # a broken armhf build must not abort the arm64 build
      matrix:
        include:
          - arch: arm64
            target: pi-3plus-4-5
          - arch: armhf
            target: pi-zero-w
    runs-on: ubuntu-24.04
    name: Build ${{ matrix.target }}
    steps:
      - name: Checkout Tonado
        uses: actions/checkout@v4
        with:
          # PR: the PR head, so the dry-run exercises the *changed* stage.
          # push/dispatch: the release tag being built.
          ref: ${{ github.event_name == 'pull_request' && github.ref || (github.event.inputs.tag || github.ref_name) }}
          fetch-depth: 0      # full history + tags: needed for describe + tag rev-parse
          fetch-tags: true
          path: tonado

      - name: Resolve build tag + expected SHA
        id: meta
        working-directory: tonado
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            push)              TAG="$REF_NAME";  GIT_REF="$REF_NAME" ;;
            workflow_dispatch) TAG="$INPUT_TAG"; GIT_REF="$INPUT_TAG" ;;
            pull_request)
              # No release tag exists for a PR. Build 'main' so the stage
              # under test exercises the actual current code (units, scripts,
              # frontend build). Using the last release tag would fail any
              # stage that references files added after that tag — exactly
              # the post-release wave we are about to ship.
              # GitHub's PR checkout does not create a local 'main' branch,
              # only the remote tracking ref — resolve via origin/main, but
              # the in-chroot 'git clone --branch main' still works fine
              # because that hits github.com directly.
              TAG="main"
              GIT_REF="origin/main"
              ;;
            *) echo "Unsupported event $EVENT" >&2; exit 1 ;;
          esac
          [ -n "${TAG:-}" ] || { echo "Could not resolve a build tag." >&2; exit 1; }
          # The stage runs `git clone --branch <TAG>` and checks the clone's HEAD
          # against EXPECTED_SHA, so resolve the ref's commit (not the PR head).
          SHA="$(git rev-parse "${GIT_REF}^{commit}")"
          # The committed frontend must exist AT THAT REF, else the in-chroot
          # stage fails late (02-tonado-code checks the same thing).
          git cat-file -e "${GIT_REF}:web/build/index.html" 2>/dev/null \
            || { echo "web/build/index.html missing in $GIT_REF" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Building Tonado $TAG ($SHA) for ${{ matrix.target }}"

      - name: Install qemu-user binaries (pi-gen host check)
        # pi-gen's build-docker.sh runs `which qemu-aarch64-static` (older
        # bookworm branches) OR `which qemu-aarch64` (newer master) on the
        # host before launching its Docker build. Install BOTH variants:
        #   qemu-user         → /usr/bin/qemu-aarch64 (dynamic)
        #   qemu-user-static  → /usr/bin/qemu-aarch64-static (static)
        # They do NOT conflict with each other. We exclude qemu-user-binfmt
        # because its Debian-style binfmt handlers register without the
        # F-flag, and the next step needs Docker-aware handlers (F-flag).
        run: |
          sudo apt-get update
          sudo apt-get remove -y qemu-user-binfmt || true
          sudo apt-get install -y --no-install-recommends \
            qemu-user qemu-user-static
          which qemu-aarch64 qemu-arm qemu-aarch64-static qemu-arm-static

      - name: Register binfmt handlers (F-flag for Docker chroot)
        uses: docker/setup-qemu-action@v3
        with:
          # Force re-registration so any stale handlers from preinstalled
          # qemu-user-static cannot win the binfmt slot.
          image: tonistiigi/binfmt:latest
          platforms: arm64,arm

      - name: Verify binfmt is active for ARM
        run: |
          ls /proc/sys/fs/binfmt_misc/
          cat /proc/sys/fs/binfmt_misc/qemu-aarch64 | head -5
          cat /proc/sys/fs/binfmt_misc/qemu-arm | head -5

      - name: Checkout pi-gen (pinned)
        uses: actions/checkout@v4
        with:
          repository: RPi-Distro/pi-gen
          ref: ${{ matrix.arch == 'arm64' && env.PI_GEN_REF_ARM64 || env.PI_GEN_REF_ARMHF }}
          path: pi-gen

      - name: Restore +x bit on shell scripts
        # Windows checkouts (and zip-based source exports) drop the executable
        # bit. pi-gen SILENTLY SKIPS a substage's run.sh / run-chroot.sh if it
        # is not executable — the stage appears to "succeed" but bakes nothing.
        # setup-ap.sh (WP1) and the other system/*.sh helpers also need +x at
        # runtime on the device. Re-apply +x to every Tonado shell hook BEFORE
        # the stage is copied into pi-gen, plus the system/ helpers in place.
        # The 00-run.sh / 00-run-chroot.sh glob deliberately covers all current
        # substages (01-sys-tweaks, 02-tonado-code, 03-tonado-config,
        # 04-tonado-finalize) and any future ones.
        working-directory: tonado
        run: |
          set -euo pipefail
          chmod +x scripts/pi-gen-stage/stage-tonado/prerun.sh
          # All substage hooks: 00-run.sh and 00-run-chroot.sh under every NN-* dir.
          find scripts/pi-gen-stage/stage-tonado -type f \
            \( -name '*.sh' -o -name 'run' -o -name 'run-chroot' \) \
            -exec chmod +x {} +
          # Runtime helpers shipped in the repo: setup-ap.sh, firstrun.sh,
          # imager-wifi-probe.sh, install.sh, uninstall.sh.
          chmod +x system/*.sh
          echo "--- executable Tonado scripts ---"
          find scripts/pi-gen-stage/stage-tonado system -type f -name '*.sh' \
            -perm -u+x -print | sort

      - name: Wire in Tonado stage
        run: |
          set -euo pipefail
          # Preserve the +x bit re-applied in the previous step (cp -r keeps
          # mode bits, but be explicit with --preserve=mode).
          cp -r --preserve=mode tonado/scripts/pi-gen-stage/stage-tonado pi-gen/stage-tonado
          # Belt-and-braces: re-assert +x on the copy in case the runner FS
          # or a future cp change strips it.
          find pi-gen/stage-tonado -type f -name '*.sh' -exec chmod +x {} +
          # Let our stage own the exported image instead of the Lite stage.
          rm -f pi-gen/stage2/EXPORT_IMAGE pi-gen/stage2/EXPORT_NOOBS

      - name: Write pi-gen config
        run: |
          set -euo pipefail
          {
            echo "IMG_NAME='tonado'"
            echo "RELEASE='bookworm'"
            echo "TARGET_HOSTNAME='tonado'"
            echo "ENABLE_SSH=1"
            echo "STAGE_LIST='stage0 stage1 stage2 stage-tonado'"
            echo "DEPLOY_COMPRESSION='xz'"
            echo "DEPLOY_ZIP=0"
            # No default password baked in. NOTE: the Raspberry Pi Imager
            # only shows its OS-customization dialog (user/password/SSH/WiFi)
            # for the official Pi OS images it recognises — NOT for a custom
            # .img.xz. So parents never set a password; the `pi` user ends up
            # with no password and password-based SSH login is impossible
            # (PermitEmptyPasswords no). That is intended: parents reach the
            # device solely through Tonado's setup AP + wizard, never a shell.
            # Tinkerers who want SSH drop a `userconf.txt` (and/or an SSH key)
            # onto the bootfs FAT partition after flashing; the Bookworm
            # userconf-pi service consumes that file on first boot regardless
            # of this flag.
            #
            # DISABLE_FIRST_BOOT_USER_RENAME=1 is MANDATORY for headless boot:
            # on Bookworm, leaving it at 0 makes the base image ship the
            # `userconfig.service` interactive first-boot user-creation prompt
            # on tty1. With no keyboard/monitor attached the box hangs at that
            # prompt forever and never reaches the setup AP — fatal for the
            # parent flow. Setting it to 1 bakes the `pi` user in directly.
            #
            # pi-gen REQUIRES a FIRST_USER_PASS when this flag is 1 (build.sh
            # aborts otherwise: "To disable user rename ... FIRST_USER_PASS
            # needs to be set"). We append a RANDOM, per-build throwaway
            # password below (after the debug cat, so it never hits the log).
            # It is never recorded anywhere, so nobody can console- or
            # SSH-password-login with it; SSH password auth is disabled anyway.
            # Tinkerers use SSH keys. (Backlog: bake PasswordAuthentication no
            # + revisit the userconf.txt path under this flag.)
            echo "DISABLE_FIRST_BOOT_USER_RENAME=1"
            # Tonado-specific. MUST be exported so sub-shells (our
            # 00-run-chroot.sh, 04-tonado-finalize/00-run.sh) inherit
            # them. pi-gen's standard vars above happen to work without
            # export because pi-gen exports them itself; custom vars
            # need the explicit `export`.
            echo "export TONADO_VERSION='${{ steps.meta.outputs.tag }}'"
            echo "export TONADO_EXPECTED_SHA='${{ steps.meta.outputs.sha }}'"
            if [ "${{ matrix.arch }}" = "armhf" ]; then
              echo "ARCH='armhf'"
            fi
          } > pi-gen/config
          echo "--- pi-gen/config (FIRST_USER_PASS appended after this, not shown) ---"
          cat pi-gen/config
          # Random throwaway pi password — required by pi-gen when
          # DISABLE_FIRST_BOOT_USER_RENAME=1. Appended AFTER the cat so it is
          # never printed to the build log. base64 alphabet is safe inside the
          # single-quoted config value.
          printf "FIRST_USER_PASS='%s'\n" "$(openssl rand -base64 24)" >> pi-gen/config
          echo "FIRST_USER_PASS set (random per-build, not logged)"

      - name: Build image
        working-directory: pi-gen
        # pi-gen's Dockerfile uses `FROM i386/debian:bookworm`. With BuildKit
        # (now default on the GitHub runner image) the strict cross-platform
        # check trips: "InvalidBaseImagePlatform: Base image i386/debian:bookworm
        # was pulled with platform linux/386, expected linux/amd64 (line 2)".
        # The classic builder does not enforce that, so pin BuildKit off for the
        # pi-gen build. Must be preserved across sudo to reach the docker call.
        run: sudo --preserve-env=DEBIAN_FRONTEND,DOCKER_BUILDKIT ./build-docker.sh
        env:
          DEBIAN_FRONTEND: noninteractive
          DOCKER_BUILDKIT: "0"

      - name: Hand deploy/ to runner user
        # pi-gen runs the build under sudo, so everything in deploy/ is owned
        # by root. Downstream steps (mv, sha256sum, cosign sign-blob, gh
        # release upload) run as the runner user and would hit EPERM. Reclaim
        # ownership in one place rather than sprinkling sudo through each step.
        run: sudo chown -R "$USER:$USER" pi-gen/deploy

      - name: Locate + rename image
        id: img
        run: |
          set -euo pipefail
          SRC="$(ls pi-gen/deploy/*.img.xz | head -n1)"
          if [ -z "${SRC:-}" ]; then
            echo "No .img.xz produced in pi-gen/deploy/" >&2
            ls -la pi-gen/deploy/ || true
            exit 1
          fi
          DEST="pi-gen/deploy/tonado-${{ steps.meta.outputs.tag }}-${{ matrix.target }}.img.xz"
          [ "$SRC" = "$DEST" ] || mv "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$DEST")" >> "$GITHUB_OUTPUT"

      - name: Guard against a baked tonado.db (BLOCKING)
        # Supply-chain guard: fail the build if a SQLite DB leaked into the
        # image under /opt/tonado/config. A baked tonado.db would give every
        # device the same per-device JWT secret + shared auth state. Runs for
        # PRs too (unlike the non-blocking qemu-smoke job) so a leak can never
        # merge. Loop-mounts the freshly built image and inspects the rootfs.
        run: sudo bash tonado/scripts/ci/assert-no-baked-db.sh "${{ steps.img.outputs.path }}"

      - name: Compute SHA256
        id: sum
        working-directory: pi-gen/deploy
        run: |
          set -euo pipefail
          sha256sum "${{ steps.img.outputs.name }}" \
            > "SHA256SUMS-${{ matrix.target }}.txt"
          cat "SHA256SUMS-${{ matrix.target }}.txt"

      - name: Cosign sign (keyless)
        uses: sigstore/cosign-installer@v3
      - name: Sign image blob
        working-directory: pi-gen/deploy
        run: |
          set -euo pipefail
          cosign sign-blob --yes \
            --output-signature "${{ steps.img.outputs.name }}.sig" \
            --output-certificate "${{ steps.img.outputs.name }}.pem" \
            "${{ steps.img.outputs.name }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ steps.img.outputs.path }}

      - name: Upload artifact (PR dry-run + always-available debug copy)
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.target }}
          path: pi-gen/deploy/tonado-*
          retention-days: 7

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: pi-gen/deploy
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          # Pushing a git tag does NOT create a GitHub Release object, and
          # nothing else in this pipeline creates it — so `gh release upload`
          # fails with "release not found". Create it idempotently here. The
          # two matrix jobs run in parallel: `view || create || true` lets the
          # first win and tolerates the loser's "already exists". --prerelease
          # because every v*-beta is a pre-release; the real notes are written
          # later by the update-release-notes job (release-notes.sh).
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --prerelease --title "$TAG" \
                 --notes "Automatischer Build läuft – Notes folgen." \
            || true
          gh release upload "$TAG" \
            "${{ steps.img.outputs.name }}" \
            "${{ steps.img.outputs.name }}.sig" \
            "${{ steps.img.outputs.name }}.pem" \
            "SHA256SUMS-${{ matrix.target }}.txt" \
            --clobber

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    # Booting a pi-gen image in QEMU is the most fragile part of the pipeline.
    # Keep it non-blocking until verified green in CI, so it never holds back a
    # release. arm64 only — armhf in QEMU is historically flakier.
    continue-on-error: true
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout Tonado
        uses: actions/checkout@v4
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-utils xz-utils
      - name: Download arm64 image
        uses: actions/download-artifact@v4
        with:
          name: image-pi-3plus-4-5
          path: img
      - name: Boot + health smoke test
        run: bash scripts/ci/qemu-smoke.sh img/tonado-*.img.xz

  update-release-notes:
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.upload == 'true'
    steps:
      - name: Checkout Tonado
        uses: actions/checkout@v4
      - name: Assemble + publish release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/release-notes.sh "${{ github.event.inputs.tag || github.ref_name }}"
